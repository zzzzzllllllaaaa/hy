<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放器</title>
    <style>
        #video-container {
            width: 640px;
            height: 360px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
        }
        #video {
            max-width: 100%;
            max-height: 100%;
        }
        #next-button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div id="video-container">
    <video id="video" controls>
        <source id="video-source" src="" type="video/mp4">
        您的浏览器不支持视频播放。
    </video>
</div>
<button id="next-button">下一个视频</button>

<script>
    let currentVideo = '';

    function fetchVideo() {
        fetch('http://api.yujn.cn/api/zzxjj.php?type=video')
            .then(response => response.text())
            .then(data => {
                currentVideo = data; // 假设API直接返回视频URL
                loadVideo();
            })
            .catch(error => console.error('获取视频失败:', error));
    }

    function loadVideo() {
        const videoElement = document.getElementById('video-source');
        videoElement.src = currentVideo;
        document.getElementById('video').load();
    }

    document.getElementById('next-button').addEventListener('click', fetchVideo);

    // 初始化
    fetchVideo();
</script>

</body>
</html>
